server:
  port: 9090

spring:
  application:
    name: gatekeeper
  datasource:
    url: jdbc:mysql://localhost:3306/gatekeeper
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379

gatekeeper:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: 86400000
